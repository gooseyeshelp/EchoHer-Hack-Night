<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day Energy</title>

<style>
:root {
  --bg:#F2F4F6;
  --ink:#17202A;
  --mute:#6B7785;
  --line:#DDE2E8;
  --card:#fff;
}

@media (prefers-color-scheme:dark) {
  :root {
    --bg:#12171D;
    --ink:#E8ECF0;
    --mute:#8A96A3;
    --line:#2A333D;
    --card:#1A2129;
  }
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
}

main {
  max-width:1100px;
  margin:0 auto;
  padding:40px 20px 60px;
}

h1 {
  font-size:28px;
  font-weight:600;
  letter-spacing:-.02em;
  margin:0 0 4px;
}

.sub {
  color:var(--mute);
  margin:0 0 28px;
}

.days {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:16px;
}

.day {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:22px;
}

.day h2 {
  font-size:18px;
  margin:0;
}

.date {
  color:var(--mute);
  font-size:14px;
  margin:0 0 18px;
}

.meter {
  display:flex;
  justify-content:center;
  align-items:center;
  height:100px;
}

.num {
  font-size:34px;
  font-weight:600;
  letter-spacing:-.03em;
}

.batt {
  width:100%;
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:center;
}

.shell {
  width:100%;
  height:44px;
  border:2px solid var(--ink);
  border-radius:10px;
  padding:3px;
}

.fill {
  height:100%;
  border-radius:6px;
}

.stats {
  color:var(--mute);
  font-size:14px;
  margin:14px 0 4px;
  text-align:center;
}

.mix {
  color:var(--mute);
  font-size:13px;
  margin:0 0 18px;
  text-align:center;
}

.soundtrack-title {
  font-size:15px;
  font-weight:600;
  margin:20px 0 10px;
}

.song {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  border-top:1px solid var(--line);
  padding:10px 0;
}

.song-info {
  min-width:0;
}

.song-name {
  font-size:14px;
  font-weight:500;
}

.artist {
  display:block;
  color:var(--mute);
  font-size:12px;
}

.tag {
  display:inline-block;
  font-size:10px;
  color:var(--mute);
  margin-top:3px;
}

.spotify {
  flex-shrink:0;
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink);
  border-radius:20px;
  padding:6px 10px;
  font:inherit;
  font-size:12px;
  cursor:pointer;
}

.spotify:hover {
  background:var(--ink);
  color:var(--bg);
}
</style>
</head>

<body>

<main>

  <h1>Your week, by energy</h1>

  <p class="sub">
    Your calendar shapes your soundtrack.
    Busy days bring familiar comfort.
    Lighter days bring more discovery.
  </p>

  <div class="days" id="days"></div>

</main>


<script>

const DAYS = [

  {
    name:"Light day",
    date:"Sun, Oct 4",
    score:26,
    events:2,
    busy:2.0,
    free:5.0,

    songs:[
      ["CUFF IT","Beyoncé","Discovery"],
      ["good 4 u","Olivia Rodrigo","Familiar"],
      ["Believer","Imagine Dragons","Discovery"],
      ["Stressed Out","Twenty One Pilots","Familiar"],
      ["Bones","Imagine Dragons","Discovery"],
      ["Ride","Twenty One Pilots","Familiar"],
      ["Stitches","Shawn Mendes","Discovery"],
      ["Dynamite","BTS","Discovery"],
      ["About Damn Time","Lizzo","Discovery"],
      ["Pink Venom","BLACKPINK","Discovery"]
    ]
  },


  {
    name:"Typical day",
    date:"Tue, Oct 6",
    score:66,
    events:6,
    busy:7.75,
    free:1.5,

    songs:[
      ["Die For You","The Weeknd","Discovery"],
      ["Something Just Like This","The Chainsmokers; Coldplay","Familiar"],
      ["Ride","Twenty One Pilots","Familiar"],
      ["Otro Atardecer","Bad Bunny; The Marías","Familiar"],
      ["Hotel California","Eagles","Discovery"],
      ["Heathens","Twenty One Pilots","Familiar"],
      ["cómo dormiste?","Rels B","Discovery"],
      ["good 4 u","Olivia Rodrigo","Familiar"],
      ["Stressed Out","Twenty One Pilots","Familiar"],
      ["Difficult","Gracie Abrams","Familiar"]
    ]
  },


  {
    name:"Packed day",
    date:"Thu, Oct 8",
    score:89,
    events:9,
    busy:11.5,
    free:0.5,

    songs:[
      ["Falling In Love","Cigarettes After Sex","Familiar"],
      ["we fell in love in october","girl in red","Familiar"],
      ["happier","Olivia Rodrigo","Familiar"],
      ["Stay","Gracie Abrams","Familiar"],
      ["October Passed Me By","girl in red","Familiar"],
      ["i wanna be your girlfriend","girl in red","Familiar"],
      ["I Wanna Be Yours","Arctic Monkeys","Discovery"],
      ["K.","Cigarettes After Sex","Familiar"],
      ["Heathens","Twenty One Pilots","Familiar"],
      ["drivers license","Olivia Rodrigo","Familiar"]
    ]
  }

];


const color = score =>
  `hsl(${Math.round(170 - score * 1.3)} 55% 45%)`;


function meter(score) {

  const c = color(score);

  return `
    <div class="batt">

      <div class="shell">

        <div
          class="fill"
          style="
            width:${score}%;
            background:${c};
          ">
        </div>

      </div>

      <div class="num">
        ${score}
      </div>

    </div>
  `;
}


function spotifySearch(song, artist) {

  const query =
    encodeURIComponent(
      `${song} ${artist.replaceAll(";", " ")}`
    );

  window.open(
    `https://open.spotify.com/search/${query}`,
    "_blank"
  );
}


function render() {

  document.getElementById("days").innerHTML =

    DAYS.map(day => `

      <section class="day">

        <h2>
          ${day.name}
        </h2>

        <p class="date">
          ${day.date}
        </p>


        <div
          class="meter"
          aria-label="Energy ${day.score} out of 100"
        >

          ${meter(day.score)}

        </div>


        <p class="stats">

          ${day.events} events ·
          ${day.busy}h busy ·
          ${day.free}h longest break

        </p>


        <p class="mix">

          ${day.score}% familiar ·
          ${100 - day.score}% discovery

        </p>


        <div class="soundtrack-title">
          Your soundtrack
        </div>


        <div>

          ${day.songs.map(song => `

            <div class="song">

              <div class="song-info">

                <div class="song-name">
                  ${song[0]}
                </div>

                <span class="artist">
                  ${song[1]}
                </span>

                <span class="tag">
                  ${song[2]}
                </span>

              </div>


              <button
                class="spotify"
                onclick='spotifySearch(
                  ${JSON.stringify(song[0])},
                  ${JSON.stringify(song[1])}
                )'
              >
                ▶ Spotify
              </button>

            </div>

          `).join("")}

        </div>

      </section>

    `).join("");
}


render();

</script>

</body>
</html>
